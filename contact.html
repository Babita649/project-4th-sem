<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CyberCafe Management</title>
    <style>
        :root {
        --card-bg: rgba(30, 41, 59, 0.8); 
          --text-light: #F8FAFC;
            --input-bg: #05070a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0B0E14;
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1f2b 0%, #0B0E14 100%);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            /* Added purple glow to the container border */
            border: 1px solid rgba(188, 19, 254, 0.3);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), 0 0 15px rgba(188, 19, 254, 0.1);
            backdrop-filter: blur(10px);
        }

        .info-section h2 {
            color: #66B032;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-item {
            margin-bottom: 15px;
        }

        .contact-item strong {
            display: block;
            color: #BC13FE; /* Purple for headers/icons */
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .contact-item p {
            margin: 0;
            font-size: 1rem;
            color: #cbd5e1;
        }

        .form-section {
            background: rgba(20, 20, 20, 0.3);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            color: var(--text-light);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box; 
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 8px rgba(102, 176, 50, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary-green);
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #ecf0ea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 176, 50, 0.4);
        }

        @media (max-width: 768px) {
            .container { 
                grid-template-columns: 1fr; 
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="info-section">
        <h2>Get in Touch</h2>
        <p style="color: #94a3b8; margin-bottom: 30px;">Need help with your membership or group booking?</p>
        
        <div class="contact-item">
            <strong>📍 LOCATION</strong>
            <p>Baluwatar, Lazimpat</p>
        </div>
        
        <div class="contact-item">
            <strong>📞 PHONE</strong>
            <p>+977-9841002345</p>
        </div>

        <div class="contact-item">
            <strong>✉️ EMAIL</strong>
            <p>info@cybercafe.com</p>
        </div>

        <div class="contact-item">
            <strong>🕒 HOURS</strong>
            <p>Mon - Sun: 08:00 AM - 02:00 AM</p>
        </div>
    </div>

    <div class="form-section">
        <form action="#">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Issue/Reason</label>
                <select required>
                    <option value="" disabled selected>Select an option</option>
                    <option>Technical Support</option>
                    <option>Membership Query</option>
                    <option>Group Booking</option>
                    <option>Feedback</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="4" placeholder="How can we help?"></textarea>
            </div>
            <button type="submit">SEND MESSAGE</button>
        </form>
    </div>
</div>

</body>
</html>
