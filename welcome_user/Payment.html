<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="sidebar">
        <h3>Welcome, User</h3>
        <a href="Dashboard.html">🏠Dashboard</a>
        <a href="Select PC.html">💻Select PC</a>
        <a href="Select Games.html">🎮Select Games</a>
        <a href="Duration.html">⏳Duration</a>
        <a href="FoodandDrinks.html">🍔Foods & Drinks</a>
        <a href="Payment.html">💳Payment</a>
        <a href="Notification.html"> 🔔Notification</a>
    </div>
    <div class="payment-container">
        <h2>Payment</h2>
        
        <div class="summary">
            <p><strong>Duration Selected:</strong> <span id="duration">1 Hour</span></p>
            <p><strong>Rate:</strong> <span id="rate">₹50/hr</span></p>
            <p><strong>Total Amount:</strong> <span id="total">₹50</span></p>
        </div>

        <form id="paymentForm">
            <h3>Payment Details</h3>
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe">

            <label for="card">Card Number</label>
            <input type="text" id="card" required placeholder="1234 5678 9012 3456" maxlength="19">

            <label for="expiry">Expiry Date</label>
            <input type="month" id="expiry" required>

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" required placeholder="123" maxlength="4">

            <button type="submit">Pay Now</button>
        </form>

        <div id="successMessage" class="success-message" style="display:none;">
            Payment Successful! Thank you.
        </div>

        <button onclick="goBack()" style="margin-top:10px;">Back</button>
    </div>

    <script src="payment.js"></script>
</body>
</html>
