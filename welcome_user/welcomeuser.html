<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Café Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #3b0d0d;
    color: white;
}
.sidebar {
    width: 250px;
    height: 100vh;
    background: #5c2020;
    color: rgb(243, 239, 239);
    position: fixed;
    padding-top: 20px;
}
.sidebar h3 {
    padding-left: 20px;
}
.sidebar a {
    display: block;
    padding: 12px 20px;
    text-decoration: none;
    color: rgb(248, 240, 240);
}
.sidebar a:hover {
    background: #312f2f;
    border-radius: 10px;
}
.main {
    margin-left: 260px;
    padding: 20px;
}
.icon-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    margin-top: 30px;
}
.icon-box {
    text-align: center;
    background: #3b0000;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
}
.icon-box img {
    width: 80px;
}
.icon-box:hover {
    background: #570000;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>Welcome, User</h3>
    <a href="Dashboard.html">Dashboard</a>
    <a href="Select PC.html">Select PC</a>
    <a href="Select Games.html">Select Games</a>
    <a href="Select Devices.html">Select Devices</a>
    <a href="Food and Drinks.html">Food & Drinks</a>
    <a href="Duration.html">Duration</a>
    <a href="Payment.html">Payment</a>
</div>
<div class="main">
    <h2>Dashboard</h2>

    <div class="icon-grid">
        <div class="icon-box" onclick="window.location.href='Select PC.html'">
            <img src="https://img.icons8.com/ios/100/monitor.png">
            <p>Select PC</p>
        </div>

        <div class="icon-box" onclick="saveData('game')">
            <img src="images/select games.jpg">
            <p>Select Games</p>
        </div>

        <div class="icon-box" onclick="saveData('device')">
            <img src="images/select pc.jpg">
            <p>Select Device</p>
        </div>

        <div class="icon-box" onclick="saveData('food')">
            <img src="">
            <p>Food & Drinks</p>
        </div>

        <div class="icon-box" onclick="saveData('duration')">
            <img src="https://img.icons8.com/ios/100/clock.png">
            <p>Duration</p>
        </div>

        <div class="icon-box" onclick="saveData('payment')">
            <img src="https://img.icons8.com/ios/100/wallet.png">
            <p>Payment</p>
        </div>
    </div>
</div>

<script>
function saveData(type) {
    let value = prompt("Enter " + type + " value:");

    if(value === "" || value === null){
        alert("No value entered");
        return;
    }

    // send to PHP
    fetch("save.php", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "type=" + type + "&value=" + value
    })
    .then(res => res.text())
    .then(data => alert(data));
}
</script>

</body>
</html>
