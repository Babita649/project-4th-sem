<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Select Games</title>
<link rel="stylesheet" href="selectgames.css">
</head>
<body>

<div class="sidebar">
    <h2>Welcome, User</h2>
    <div class="menu-item" href="Dashboard.html">Dashboard</div>
    <div class="menu-item" href="Select PC.html">Select PC</div>
    <div class="menu-item active" href="Select Games.html">Select Games</div>
    <div class="menu-item" href="Duration.html">Duration</div>
    <div class="menu-item" href="FoodandDrinks.html">Foods & Drinks</div>
    <div class="menu-item" href="Payment.html">Payment</div>
    <div class="menu-item" href="Notification.html">Notification</div>
</div>

<div class="content">
    <input type="text" placeholder="Search for games." class="search-bar" />

    <div class="featured-section">
        <div class="featured-img" onclick="selectGame(this)">
            <img src="../images/game1.jpg" alt="Games" />
        </div>

        <div class="library-box">
            <h3>In Library</h3>

            <div class="game-entry" onclick="selectGame(this)">
                <img src="../images/game2.jpg" />
                <div>
                    <strong>GHOST OF YOTEI</strong><br />
                    <div class="tags">
                        <span>Physics-based</span>
                        <span>3D</span>
                        <span>Adventure</span>
                    </div>
                </div>
            </div>

            <div class="game-entry" onclick="selectGame(this)">
                <img src="../images/game3.jpg" />
                <div>
                    <strong>GHOST OF TSUSHIMA</strong><br />
                    <div class="tags">
                        <span>Action</span>
                        <span>Adventure</span>
                    </div>
                </div>
            </div>

            <div class="game-entry" onclick="selectGame(this)">
                <img src="../images/game4.jpg" />
                <div>
                    <strong>FORZA HORIZON 5</strong><br />
                    <div class="tags">
                        <span>Open-world</span>
                        <span>Racing</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="recommend-section">
        <h3>You Might Like this</h3>
        <div class="recommend-row" onclick="selectGame(this)">
            <img src="../images/game5.jpg" />
            <img src="../images/game6.jpg" />
            <img src="../images/game7.jpg" />
            <img src="../images/game8.jpg" />
        </div>
    </div>
    
    <div class="nav-buttons" style="margin-top:30px; display:flex; justify-content:flex-end; gap:15px; padding-right:20px;">
        <button id="btnBack" style="padding:12px 20px; background:#c57c7c; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">⬅ Back</button>
        <button id="btnNext" style="padding:12px 20px; background:#c57c7c; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Next ➜</button>
    </div>

<script>
        let selected = null;
      function selectGame(el){
      if(selected) selected.classList.remove('selected');
     el.classList.add('selected');
     selected = el;
    const nextBtn = document.getElementById('btnNext');
   nextBtn.style.opacity = '1';
      nextBtn.style.pointerEvents = 'auto';
      }
   document.getElementById('btnBack').onclick = ()=>{
    window.location.href = "Select PC.html";
    };
    document.getElementById('btnNext').onclick = ()=>{
    if(selected)
    alert('Proceeding with selected game: ' + selected.innerText.trim());
     };
    </script>
</div>
</body>
</html>
