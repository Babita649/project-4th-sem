<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Dashboard</title>
    <link rel="stylesheet" href="pcselected.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
   <div class="sidebar">
        <h3>Welcome, Admin</h3>

        <ul class="menu">
            <li class="active"><span>🏠</span> Dashboard</li>
            <li><span>💻</span> PC Selected</li>
            <li><span>🎮</span> Games</li>
            <li><span>🕹️</span> Controller</li>
            <li><span>🍔</span> Food Menus</li>
            <li><span>⏳</span> Duration</li>
            <li><span>💳</span> Payment</li>
        </ul>

        <div class="profile">
            <div class="icon">A</div>
            <span>Admin</span>
        </div>
    </div>

    <!-- Main Area -->
    <div class="content">
        <div class="stats">
            <div class="box clickable" id="pcsInUseBox">
                <h3>Total PCs</h3>
                <p class="large" id="pcsInUseCount">13</p>
                <span>PCs in use</span>
            </div>

            <div class="box clickable" id="totalPcsBox">
                <h3>Total PCs</h3>
                <p class="large" id="totalPcsCount">100</p>
                <span>PCs in system</span>
            </div>
        </div>

        <p class="occupied-label">Total no of PC occupied : <span id="occupiedLabel">13</span></p>

        <!-- PC Grid -->
        <div class="grid" id="pcGrid"></div>
    </div>
</div>

<!-- Popup -->
<div class="popup-bg" id="popupBg">
    <div class="popup">
        <h2 id="popupTitle">Popup</h2>
        <div id="popupContent"></div>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
