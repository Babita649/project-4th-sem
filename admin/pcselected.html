<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Dashboard</title>
    <link rel="stylesheet" href="pcselected.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Welcome, User</h3>
        <div class="menu">
            <a href="Dashboard.html">🏠 Dashboard</a>
            <a href="pcselected.html">💻 Available PC</a>
            <a href="games.html">🎮Games Available</a>
            <a href="food.html">🍔 Food & Drinks</a>
            <a href="Duration.html">⏳ Time Management</a>
            <a href="Payment.html">💳 Payment</a>
            <a href="Notification.html">🔔 Notifications</a>
        </div>
    </div>
           <div class="admin-footer">
            <div class="circle">A</div>
            <p>Admin</p>
        </div>
    </div>


    <!-- Main Area -->
    <div class="content">
        <div class="stats">
            <div class="box clickable" id="pcsInUseBox">
                <h3>Total PCs</h3>
                <p class="large" id="pcsInUseCount">13</p>
                <span>PCs in use</span>
            </div>

            <div class="box clickable" id="totalPcsBox">
                <h3>Total PCs</h3>
                <p class="large" id="totalPcsCount">100</p>
                <span>PCs in system</span>
            </div>
        </div>

        <p class="occupied-label">Total no of PC occupied : <span id="occupiedLabel">13</span></p>

        <!-- PC Grid -->
        <div class="grid" id="pcGrid"></div>
    </div>
</div>

<!-- Popup -->
<div class="popup-bg" id="popupBg">
    <div class="popup">
        <h2 id="popupTitle">Popup</h2>
        <div id="popupContent"></div>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
